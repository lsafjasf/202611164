<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>低多边形星球生成器 · 可复现</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", "PingFang SC", sans-serif;
         background: #0b0e1a; color: #dfe6f5; display: flex; height: 100vh; overflow: hidden; }
  #view { flex: 1; position: relative; }
  canvas { width: 100%; height: 100%; display: block; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #panel { width: 360px; background: #12172b; padding: 14px; overflow-y: auto;
           border-left: 1px solid #232c4d; font-size: 13px; }
  h1 { font-size: 16px; margin: 0 0 10px; color: #8fb8ff; }
  h2 { font-size: 13px; margin: 14px 0 6px; color: #7c93c9; }
  .row { display: flex; gap: 6px; align-items: center; margin: 5px 0; flex-wrap: wrap; }
  button { background: #22305c; color: #dfe6f5; border: 1px solid #3a4c85; border-radius: 5px;
           padding: 5px 10px; cursor: pointer; font-size: 12px; }
  button:hover { background: #2c3f78; }
  button.active { background: #4a2c78; border-color: #8a5cd6; }
  input[type=number] { width: 90px; background: #0c1122; color: #dfe6f5;
                       border: 1px solid #3a4c85; border-radius: 4px; padding: 4px; }
  input[type=range] { width: 150px; }
  label { color: #9fb0d8; }
  .stat { background: #0c1122; border-radius: 6px; padding: 8px; margin: 6px 0;
          white-space: pre-wrap; word-break: break-all; line-height: 1.5; }
  .ok { color: #6fe3a5; } .bad { color: #ff7d7d; } .dim { color: #7787ad; }
  .hash { font-family: monospace; font-size: 11px; color: #ffd479; }
</style>
</head>
<body>
  <div id="view"><canvas id="gl"></canvas></div>
  <div id="panel">
    <h1>🪐 低多边形星球生成器</h1>
    <div class="row">
      <label>Seed</label>
      <input type="number" id="seedInput" value="764001">
      <button id="applySeed">应用</button>
    </div>
    <div class="row">
      <button id="seedA">Seed A (764001)</button>
      <button id="seedB">Seed B (924202)</button>
      <button id="seedRand">随机</button>
      <button id="regen">🔄 重新生成</button>
    </div>
    <h2>参数（仅重算受影响区域）</h2>
    <div class="row"><label>海平面</label><input type="range" id="seaLevel" min="0.35" max="0.65" step="0.01"><span id="seaLevelV"></span></div>
    <div class="row"><label>极冠阈值</label><input type="range" id="polarCap" min="0.55" max="0.9" step="0.01"><span id="polarCapV"></span></div>
    <div class="row"><label>云覆盖</label><input type="range" id="cloudCoverage" min="0.4" max="0.7" step="0.01"><span id="cloudCoverageV"></span></div>
    <div class="row"><label>目标数量</label><input type="range" id="targetCount" min="2" max="12" step="1"><span id="targetCountV"></span></div>
    <div class="row"><label>旋转速度</label><input type="range" id="rotationSpeed" min="0" max="1" step="0.05"><span id="rotationSpeedV"></span></div>
    <h2>操作</h2>
    <div class="row">
      <button id="screenshot">📷 截图</button>
      <button id="saveParams">💾 保存参数</button>
      <button id="loadParams">📂 载入参数</button>
      <input type="file" id="fileInput" accept=".json" style="display:none">
    </div>
    <div class="row">
      <button id="obstacleMode">🚧 添加障碍</button>
      <button id="moveMode">🎯 移动目标</button>
      <button id="runChecks">✅ 运行校验</button>
    </div>
    <h2>状态</h2>
    <div class="stat" id="statusBox"></div>
    <h2>校验结果</h2>
    <div class="stat" id="checkBox"><span class="dim">点击「运行校验」</span></div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
