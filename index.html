<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>六振荡器和声网络</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>六振荡器和声网络</h1>
  <div class="transport">
    <button id="btnPlay">▶ 播放</button>
    <button id="btnPause">⏸ 暂停</button>
    <button id="btnStop">⏹ 停止</button>
    <label class="loop-toggle"><input type="checkbox" id="chkLoop" checked> 循环</label>
    <label>速度 <input type="range" id="rngBpm" min="40" max="240" value="96"> <span id="lblBpm">96</span> BPM</label>
    <label>变调 <input type="range" id="rngTranspose" min="-12" max="12" value="0"> <span id="lblTranspose">0</span> 半音</label>
  </div>
  <div class="transport">
    <button id="btnSave">💾 保存工程</button>
    <button id="btnLoad">📂 重载工程</button>
    <button id="btnExport">⬇ 导出 WAV</button>
    <button id="btnCompare">⚖ 对比首轮/重载</button>
    <span id="status">就绪</span>
  </div>
</header>
<main>
  <section class="canvas-wrap">
    <canvas id="cvNetwork" width="640" height="480"></canvas>
    <canvas id="cvWave" width="640" height="140"></canvas>
  </section>
  <aside>
    <h2>连接编辑</h2>
    <p id="connLabel">点击两个节点选择连接</p>
    <label>强度 <input type="range" id="rngConnStr" min="0" max="1" step="0.01" value="0"></label>
    <label>相位 <input type="range" id="rngConnPhase" min="0" max="1" step="0.01" value="0"></label>
    <h2>节点参数</h2>
    <div id="voicePanel"></div>
    <h2>对比结果</h2>
    <pre id="compareOut">尚未对比</pre>
  </aside>
</main>
<script src="app.js"></script>
</body>
</html>
