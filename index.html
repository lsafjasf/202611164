<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>群岛航线生成器 · 固定 seed 可复现</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <header>
      <h1>群岛航线生成器</h1>
      <p class="subtitle">固定 seed 生成 · 码头→灯塔航线 · 浮标修复 · 增量重算 · 哈希复现校验</p>
    </header>

    <main class="layout">
      <section class="panel">
        <h2>生成器</h2>
        <label>Seed
          <input id="seedInput" type="text" value="harbor-2026" />
        </label>
        <label>预设 seed
          <select id="seedPreset">
            <option value="harbor-2026">harbor-2026</option>
            <option value="lighthouse-777">lighthouse-777</option>
            <option value="atoll-042">atoll-042</option>
            <option value="">自定义（用左侧输入框）</option>
          </select>
        </label>
        <button id="regenerateBtn" class="primary">显式重新生成</button>

        <h2>参数（增量重算）</h2>
        <label>岛屿槽位 <input id="islandSlots" type="number" min="1" max="30" /></label>
        <label>浅滩槽位 <input id="shallowSlots" type="number" min="0" max="24" /></label>
        <label>浮标数量 <input id="buoyCount" type="number" min="0" max="12" /></label>
        <button id="applyParamsBtn">应用参数（仅重算受影响区域）</button>

        <h2>编辑模式</h2>
        <div class="btn-row">
          <button id="modeBuoy" class="active">移动浮标</button>
          <button id="modeObstacle">投放障碍</button>
        </div>
        <button id="removeObstacleBtn">移除最近障碍</button>

        <h2>持久化与校验</h2>
        <div class="btn-row">
          <button id="saveBtn">保存</button>
          <button id="loadBtn">载入并核对哈希</button>
        </div>
        <div class="btn-row">
          <button id="exportBtn">导出 JSON</button>
          <button id="importBtn">导入 JSON</button>
        </div>
        <button id="runTestsBtn">运行可复现自检（11 项）</button>
        <textarea id="importText" rows="8" placeholder="导出的场景 JSON 或自检结果"></textarea>
      </section>

      <section class="chart-wrap">
        <canvas id="chart" width="960" height="640"></canvas>
        <div id="message" class="message">就绪</div>
        <div id="audioStatus" class="audio">海况：未启动</div>
      </section>

      <section class="panel summary-panel">
        <h2>Seed / 目标数量 / 规则摘要</h2>
        <pre id="summary"></pre>
      </section>
    </main>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
