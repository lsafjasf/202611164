<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>地下室声纹调查 · Basement Acoustic Case</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>地下室声纹调查</h1>
      <p class="sub">在不同位置放置监听器，仅凭声音推断三条通道的声源、墙面与门洞。</p>
    </div>
    <div class="case-meta">
      <label>案件 Seed
        <input id="seedInput" type="text" autocomplete="off" spellcheck="false" />
      </label>
      <div class="meta-row">
        <span id="phaseBadge" class="badge">待开始</span>
        <span id="timer" class="timer">00:00</span>
      </div>
    </div>
  </header>

  <main>
    <section class="panel controls-panel">
      <div class="btn-row">
        <button id="btnStart" class="primary">开始调查</button>
        <button id="btnPause" disabled>暂停</button>
        <button id="btnReopen" disabled>同 Seed 重开</button>
        <button id="btnSubmit" class="warn" disabled>提交结论</button>
        <button id="btnNewCase">新案件</button>
      </div>
      <p class="rule-note">惩罚规则：每条错误判断在结算时计入
        <b id="penaltyRuleLabel"></b> 秒调查耗时（规则对同一 Seed 恒定）。</p>
    </section>

    <section class="panel">
      <h2>① 选择监听位置（无平面图）</h2>
      <div id="positionGrid" class="position-grid"></div>
    </section>

    <section class="panel">
      <h2>② 实时频谱</h2>
      <canvas id="spectrumCanvas" width="720" height="180"></canvas>
      <div class="legend">
        <span>低频 20–250 Hz</span><span>中频 250–2 kHz</span><span>高频 2–8 kHz</span>
      </div>
    </section>

    <section class="panel">
      <h2>③ 两个时间窗口（可对比）</h2>
      <div class="track-grid">
        <div class="track-card" id="trackCardA">
          <header><b>窗口 A</b><span class="track-meta" id="trackMetaA">未录制</span></header>
          <canvas id="trackCanvasA" width="340" height="120"></canvas>
          <div class="btn-row tight">
            <button id="btnRecA" disabled>录制 A</button>
            <button id="btnPlayA" disabled>播放 A</button>
          </div>
        </div>
        <div class="track-card" id="trackCardB">
          <header><b>窗口 B</b><span class="track-meta" id="trackMetaB">未录制</span></header>
          <canvas id="trackCanvasB" width="340" height="120"></canvas>
          <div class="btn-row tight">
            <button id="btnRecB" disabled>录制 B</button>
            <button id="btnPlayB" disabled>播放 B</button>
          </div>
        </div>
      </div>
      <div class="btn-row">
        <button id="btnCompare" disabled>依次对比 A → B</button>
        <span class="hint-text">每段最长 <span id="maxRecLabel"></span> 秒；暂停会冻结录音，不改变内容。</span>
      </div>
    </section>

    <section class="panel">
      <h2>④ 推断结论（提交前不显示任何真实参数）</h2>
      <div id="deductionForm" class="deduction-grid"></div>
    </section>

    <section class="panel hidden" id="settlementPanel">
      <h2>⑤ 结算对照</h2>
      <div id="settlementSummary" class="summary"></div>
      <div id="settlementHints" class="hints"></div>
      <div class="table-wrap">
        <table id="evidenceTable">
          <thead>
            <tr>
              <th>通道</th><th>判断维度</th><th>你的选择</th><th>真实参数</th>
              <th>对应声源</th><th>时间 / 窗口</th><th>频段</th><th>结果</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/engine.js"></script>
  <script src="js/visuals.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
