<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>关键帧工程导入器</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font-family: system-ui, sans-serif;
         background: #0d1015; color: #e6e9ee; }
  header { padding: 12px 20px; border-bottom: 1px solid #232933; }
  header h1 { font-size: 16px; margin: 0; }
  main { display: grid; grid-template-columns: 1fr 340px; gap: 12px;
         padding: 12px 20px; }
  .panel { background: #14181f; border: 1px solid #232933;
           border-radius: 8px; padding: 12px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px;
             align-items: center; margin-bottom: 10px; }
  button, select, label.file { background: #1f2630; color: #e6e9ee;
    border: 1px solid #33404f; border-radius: 6px; padding: 6px 12px;
    font-size: 13px; cursor: pointer; }
  button:hover { background: #27313e; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.danger { border-color: #7a3a3a; color: #f0a0a0; }
  canvas { width: 100%; height: 320px; display: block;
           border-radius: 6px; }
  #progressBar { width: 100%; height: 8px; background: #232933;
                 border-radius: 4px; overflow: hidden; margin-top: 8px; }
  #progressFill { height: 100%; width: 0; background: #3d9df2;
                  transition: width 80ms linear; }
  .kv { display: grid; grid-template-columns: 110px 1fr;
        row-gap: 4px; font-size: 12px; }
  .kv dt { color: #8b93a1; } .kv dd { margin: 0;
    word-break: break-all; }
  #errors { max-height: 180px; overflow: auto; font-size: 12px;
            margin-top: 8px; }
  #errors li { color: #f0a0a0; }
  #log { max-height: 220px; overflow: auto; font-size: 11px;
         font-family: ui-monospace, monospace; margin-top: 8px; }
  #log .error { color: #f0a0a0; } #log .warn { color: #f2cf8d; }
  #log .info { color: #9fd6a0; }
  #recovery { font-size: 12px; color: #f2cf8d; margin-top: 8px;
              display: none; }
  h2 { font-size: 13px; margin: 0 0 8px; color: #aab2bf; }
</style>
</head>
<body>
<header><h1>关键帧工程导入器(分块解析 · 可取消 · 字段级校验)</h1></header>
<main>
  <section class="panel">
    <div class="toolbar">
      <button id="btnNormal">导入正常场景(5万帧)</button>
      <button id="btnBoundary">导入边界场景</button>
      <button id="btnCorrupted">导入损坏场景</button>
      <label class="file">选择 JSON 文件
        <input id="fileInput" type="file" accept=".json" hidden></label>
      <select id="mode">
        <option value="strict">严格模式</option>
        <option value="tolerant">容错模式</option>
      </select>
      <button id="btnCancel" class="danger" disabled>取消导入</button>
    </div>
    <canvas id="stage"></canvas>
    <div id="progressBar"><div id="progressFill"></div></div>
  </section>
  <aside>
    <div class="panel">
      <h2>状态与指标</h2>
      <dl class="kv" id="metrics"></dl>
      <div id="recovery"></div>
    </div>
    <div class="panel" style="margin-top:12px">
      <h2>字段级错误</h2>
      <ul id="errors"></ul>
    </div>
    <div class="panel" style="margin-top:12px">
      <h2>运行日志</h2>
      <div id="log"></div>
    </div>
  </aside>
</main>
<script src="src/chunkParser.js"></script>
<script src="src/importer.js"></script>
<script src="src/scenarios.js"></script>
<script src="src/canvasView.js"></script>
<script src="src/main.js"></script>
</body>
</html>
